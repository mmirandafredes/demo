name: Gastos de la Casa - publicar en GitHub Pages

# Para activarlo: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['gastos-casa/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo los archivos de la app)
        run: |
          mkdir _sitio
          cp -r gastos-casa/index.html gastos-casa/manifest.webmanifest gastos-casa/sw.js \
                gastos-casa/css gastos-casa/js gastos-casa/data gastos-casa/icons _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deployment
        uses: actions/deploy-pages@v4
