name: Gastos de la Casa - tests

on:
  push:
    paths: ['gastos-casa/**', '.github/workflows/gastos-casa-tests.yml']
  pull_request:
    paths: ['gastos-casa/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gastos-casa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Tests de lógica (parser, clasificación, saldos)
        run: npm test
      - name: Instalar navegadores (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Tests de punta a punta en los 3 motores
        run: npm run test:e2e
